project:
  type: book
  output-dir: _book

lang: pt

book:
  title: "Manual de Matemática"
  subtitle: "Da aritmética à geometria diferencial"
  author: "Projeto Manuais de Ciências"
  date: today
  search: true
  # Troque SEU-USUARIO pelo seu usuário/organização do GitHub:
  repo-url: https://github.com/VitorMattosDev/manual-matematica
  repo-branch: main
  repo-actions: [edit, issue]
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: "Manual de Matemática — licença CC BY-SA 4.0"
    right: "Construído com [Quarto](https://quarto.org)."
  chapters:
    - index.qmd
    - part: "Volume I — Fundamentos: Lógica e Aritmética"
      chapters:
        - volumes/v1-fundamentos/01-logica.qmd
        - volumes/v1-fundamentos/02-conjuntos.qmd
        - volumes/v1-fundamentos/03-inducao.qmd
        - volumes/v1-fundamentos/04-naturais.qmd
        - volumes/v1-fundamentos/05-inteiros-divisibilidade.qmd
        - volumes/v1-fundamentos/06-mdc-euclides.qmd
        - volumes/v1-fundamentos/07-primos-tfa.qmd
        - volumes/v1-fundamentos/08-congruencias.qmd
        - volumes/v1-fundamentos/09-racionais.qmd
        - volumes/v1-fundamentos/10-reais-introducao.qmd
    - part: "Volume II — Álgebra Elementar"
      chapters:
        - volumes/v2-algebra/01-expressoes.qmd
        - volumes/v2-algebra/02-equacoes-1grau.qmd
        - volumes/v2-algebra/03-sistemas-lineares.qmd
        - volumes/v2-algebra/04-equacoes-2grau.qmd
        - volumes/v2-algebra/05-inequacoes.qmd
        - volumes/v2-algebra/06-polinomios.qmd
        - volumes/v2-algebra/07-fatoracao.qmd
        - volumes/v2-algebra/08-funcoes-polinomiais.qmd
        - volumes/v2-algebra/09-progressoes.qmd
        - volumes/v2-algebra/10-combinatoria.qmd
    - part: "Volume III — Geometria e Trigonometria"
      chapters:
        - volumes/v3-geometria/01-euclidiana-axiomas.qmd
        - volumes/v3-geometria/02-triangulos.qmd
        - volumes/v3-geometria/03-semelhanca-tales.qmd
        - volumes/v3-geometria/04-pitagoras.qmd
        - volumes/v3-geometria/05-circunferencia.qmd
        - volumes/v3-geometria/06-areas.qmd
        - volumes/v3-geometria/07-poliedros.qmd
        - volumes/v3-geometria/08-volumes.qmd
        - volumes/v3-geometria/09-trigonometria-triangulo.qmd
        - volumes/v3-geometria/10-trigonometria-circulo.qmd
        - volumes/v3-geometria/11-geometria-analitica.qmd
        - volumes/v3-geometria/12-conicas.qmd
    - part: "Volume IV — Pré-cálculo (Funções)"
      chapters:
        - volumes/v4-precalculo/01-funcoes.qmd
        - volumes/v4-precalculo/02-afim-quadratica.qmd
        - volumes/v4-precalculo/03-modular.qmd
        - volumes/v4-precalculo/04-exponencial.qmd
        - volumes/v4-precalculo/05-logaritmo.qmd
        - volumes/v4-precalculo/06-trigonometricas.qmd
        - volumes/v4-precalculo/07-sequencias.qmd
  appendices:
    - notacao.qmd

bibliography: references.bib

# Rótulos em português para os ambientes de teorema, prova, etc.
language:
  crossref-thm-title: "Teorema"
  crossref-lem-title: "Lema"
  crossref-cor-title: "Corolário"
  crossref-prp-title: "Proposição"
  crossref-def-title: "Definição"
  crossref-exm-title: "Exemplo"
  crossref-exr-title: "Exercício"
  proof-title: "Demonstração"
  remark-title: "Observação"
  solution-title: "Solução"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    # MathJax (padrão) lida melhor com notação avançada do que KaTeX.
  pdf:
    documentclass: scrbook
    papersize: a4
    number-sections: true
    toc: true
    include-in-header:
      text: |
        \usepackage{amsmath,amssymb,amsthm}
