name: Publicar manual

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true   # necessário para gerar o PDF

      - name: Instalar Chrome headless
        # Necessário para o Quarto rasterizar o diagrama mermaid do index.qmd no
        # PDF; sem ele o render trava em [1/134] index.qmd no runner Ubuntu.
        run: quarto install chrome-headless-shell --no-prompt

      - name: Instalar pacotes LaTeX das figuras TikZ
        # As figuras .tikz são compiladas pelo filtro chamando pdflatex/dvisvgm
        # direto (fora do latexmk do Quarto), então o TinyTeX base precisa destes
        # pacotes e do binário dvisvgm. O setup do Quarto não põe o tlmgr no PATH;
        # localizamo-lo pelo nome (é symlink, por isso sem -type f).
        run: |
          TLMGR="$(find / -name tlmgr 2>/dev/null | head -1)"
          test -n "$TLMGR" || { echo "tlmgr nao encontrado no runner"; exit 1; }
          echo "$(dirname "$TLMGR")" >> "$GITHUB_PATH"
          "$TLMGR" install standalone pgf pgfplots dvisvgm xcolor amsmath amsfonts

      - name: Renderizar e publicar no GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
