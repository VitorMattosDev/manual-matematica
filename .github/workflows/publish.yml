name: Publicar manual

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true   # necessário para gerar o PDF

      - name: Instalar Chrome headless
        # Necessário para o Quarto rasterizar o diagrama mermaid do index.qmd no
        # PDF; sem ele o render trava em [1/134] index.qmd no runner Ubuntu.
        run: quarto install chrome-headless-shell --no-prompt

      - name: Instalar pacotes LaTeX das figuras TikZ
        # As figuras .tikz são compiladas pelo filtro chamando pdflatex/dvisvgm
        # direto (fora do latexmk do Quarto), então o auto-install do Quarto não
        # as cobre. O TinyTeX base não traz estes pacotes nem o binário dvisvgm.
        # O setup do Quarto não põe o tlmgr no PATH dos passos seguintes, então o
        # localizamos pelo diretório do TinyTeX e o adicionamos ao PATH.
        run: |
          # Diagnóstico: onde está o TinyTeX/tlmgr (tlmgr costuma ser symlink, por
          # isso sem -type f). tlmgr.pl é o script real, chamável via perl.
          echo "=== which ==="; which tlmgr pdflatex dvisvgm 2>/dev/null || true
          echo "=== dirs tinytex ==="; find / -maxdepth 8 -iname '*tinytex*' -type d 2>/dev/null | head || true
          TLMGR="$(find / -name tlmgr 2>/dev/null | head -1)"
          [ -z "$TLMGR" ] && TLMGR="$(find / -name tlmgr.pl 2>/dev/null | head -1)"
          echo "tlmgr encontrado em: $TLMGR"
          test -n "$TLMGR" || { echo "ERRO: tlmgr nao encontrado no runner"; exit 1; }
          echo "$(dirname "$TLMGR")" >> "$GITHUB_PATH"
          "$TLMGR" install standalone pgf pgfplots dvisvgm xcolor amsmath amsfonts

      - name: Renderizar e publicar no GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
